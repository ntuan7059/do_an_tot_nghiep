version: "3.8"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: snipeit-app
    ports:
      - "8080:8000"   # match PHP built-in server port from Dockerfile
    environment:
      APP_KEY: ${APP_KEY}
      APP_URL: ${APP_URL}
      APP_ENV: local
      APP_DEBUG: false
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
    depends_on:
      - db
    volumes:
      - ./:/var/www/html:delegated
    restart: unless-stopped

  db:
    image: mariadb:10.11
    container_name: snipeit-db
    restart: unless-stopped
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: snipeit
      MYSQL_USER: root
      MYSQL_PASSWORD: root
    volumes:
      - db_data:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin
    container_name: snipeit-phpmyadmin
    restart: unless-stopped
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      PMA_USER: root
      PMA_PASSWORD: root

  nginx:
    image: nginx:alpine
    container_name: snipeit-nginx
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html:delegated
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app

volumes:
  db_data: